name: Open PR

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      branch:
        type: string
        required: true
      title:
        type: string
        required: true
      paths:
        type: string
        required: true
    secrets:
      token:
        required: true

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the changes
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/changes

      - name: Reject symlinks in the changes
        run: |
          if find "$RUNNER_TEMP/changes" -type l | grep -q .; then
            echo "The update job produced a symlink; refusing to open the PR."
            exit 1
          fi

      - name: Apply the changed paths
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          for path in $PATHS; do
            rm -rf "$path"
            cp -R "$RUNNER_TEMP/changes/files/$path" "$path"
          done

      - name: Open or update the PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.token }}
          base: main
          branch: ${{ inputs.branch }}
          delete-branch: true
          title: ${{ inputs.title }}
          commit-message: ${{ inputs.title }}
          body-path: ${{ runner.temp }}/changes/pr-body.md
          add-paths: ${{ inputs.paths }}
