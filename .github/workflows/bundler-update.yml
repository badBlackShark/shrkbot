name: Bundler update

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The fasttext gem compiles with -march=native by default, and a cached bundle
  # restored on a runner with an older CPU dies with SIGILL at require time.
  BUNDLE_BUILD__FASTTEXT: "--with-optflags="

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Update Bundler in the lockfile
        id: update
        run: |
          bundle config set --local deployment false
          bundle config set --local frozen false
          echo "from=$(tail -1 Gemfile.lock | xargs)" >> "$GITHUB_OUTPUT"
          bundle update --bundler
          echo "to=$(tail -1 Gemfile.lock | xargs)" >> "$GITHUB_OUTPUT"

      - name: Open or update the Bundler PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SECURITY_PR_TOKEN }}
          base: main
          branch: bundler-update
          delete-branch: true
          title: Update Bundler to ${{ steps.update.outputs.to }}
          commit-message: Update Bundler to ${{ steps.update.outputs.to }}
          body: |
            Bundler ${{ steps.update.outputs.from }} → ${{ steps.update.outputs.to }}. Dependabot never changes the `BUNDLED WITH` version, and it resolves with the newest Bundler, so a stale pin makes the two write different lockfiles. See `docs/running/dependency-updates.md`.
          add-paths: Gemfile.lock
