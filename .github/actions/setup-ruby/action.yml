name: Set up Ruby
description: Installs the pinned Ruby with the bundle cache, building fasttext portably

runs:
  using: composite
  steps:
    - name: Build fasttext without native optimisation
      shell: bash
      run: echo 'BUNDLE_BUILD__FASTTEXT=--with-optflags=' >> "$GITHUB_ENV"

    - name: Set up Ruby
      uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
      with:
        bundler-cache: true
