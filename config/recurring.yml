#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_stale_failed_jobs:
    command: "SolidQueue::FailedExecution.where(created_at: ...30.days.ago).discard_all_in_batches"
    schedule: every day at 4am
  moderation_phash_prune:
    command: "Ops::Moderation::Phashes::Prune.call"
    schedule: every day at 5am
  clear_finished_twilight_struggle_posts:
    command: "SolidQueue::Job.clear_finished_in_batches(class_name: \"TwilightStruggle::PostJob\", finished_before: Time.current)"
    schedule: every hour at minute 27
  clear_stale_twilight_struggle_post_failures:
    command: "SolidQueue::FailedExecution.joins(:job).where(solid_queue_jobs: {class_name: \"TwilightStruggle::PostJob\"}).where(created_at: ...48.hours.ago).discard_all_in_batches"
    schedule: every hour at minute 42
