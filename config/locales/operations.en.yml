---
en:
  activerecord:
    errors:
      models:
        feeds/subscription:
          custom_message_empty: A custom message would post nothing. Add some text,
            or pick a role to ping.
  operations:
    feeds:
      subscriptions:
        already_followed: This server already follows %{name}.
        cap: This server follows %{max} games, the most it can. Stop following one
          to add another.
    logging:
      moderation_dependency: can't be turned off or lose its channel while Server
        Shield is enabled
    moderation:
      logging_required: requires the Logging plugin enabled with a log channel set
      staff_role_in_use: A staff role is required while a sub-plugin is enabled.
      staff_role_required: requires a staff role set on the Server Shield overview
    plugin_activation:
      requires_settings: requires the plugin's settings to be configured first
    reminders:
      duration_too_long: That's too far in the future for a reminder.
      invalid_duration: I couldn't understand that duration. Try something like `1d2h30m`.
      message_required: A reminder needs a message.
    roles:
      messages:
        post_failed: Could not post the role message - check the channel.
    server_configuration:
      destroy:
        preview_protected: Could not delete this server - it is a preview, not a real
          Discord guild.
      plugins:
        requires_parent: "%{plugin} is part of %{parent}. Turn %{parent} on first."
        requires_settings: "%{plugin} can't be enabled until its required settings
          are configured."
    twilight_struggle:
      destinations:
        post_delay_invalid: Posting delay must be a whole number of minutes between
          0 and %{max}.
