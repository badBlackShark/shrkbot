paths:
  /tournaments/{external_id}:
    parameters:
      - name: external_id
        in: path
        required: true
        description: Your own id for the tournament — whatever you use as its primary key.
        schema:
          type: string
          example: "otsl-2026"
    put:
      tags: [Tournaments]
      summary: Create or update a tournament
      description: >-
        Creates the tournament on the first call for this id and updates it in
        place on every later one. A tournament must exist before any game or
        child tournament that references it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournament]
              properties:
                tournament:
                  $ref: "#/components/schemas/TournamentInput"
      responses:
        "200":
          description: Tournament updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentUpsertResponse"
        "201":
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentUpsertResponse"
        "401":
          description: Missing or invalid bearer token
        "422":
          description: Validation failed, or `parent_external_id` names a tournament we do not know
    delete:
      tags: [Tournaments]
      summary: Delete a tournament
      description: >-
        Deletes the tournament and its games. This never touches Discord: result
        messages already posted for those games stay up.
      responses:
        "204":
          description: Tournament deleted, or no such tournament
        "401":
          description: Missing or invalid bearer token
components:
  schemas:
    TournamentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: "Online Twilight Struggle League"
        parent_external_id:
          type: string
          description: >-
            Your id of an already-sent parent tournament, which groups this one
            under a larger event. An id we do not know is a `422`.
          example: "otsl"
        status:
          type: string
          description: >-
            Free text, stored and shown back to you exactly as you send it. One
            value changes what we do. When the status is `closed`, in any
            capitalisation and ignoring surrounding spaces, the tournament moves
            to the archived part of a server's subscription list and carries a
            closed badge there. Every other value is inert, `Registration Closed`
            included.
          example: "closed"
        admins:
          type: array
          description: >-
            Discord IDs of the tournament's organisers. Sending the key replaces
            the whole set; omitting it (or sending `null`) leaves our rows alone;
            `[]` clears them.
          items:
            type: string
            pattern: "^[0-9]+$"
            example: "123456789012345678"
    TournamentUpsertResponse:
      type: object
      properties:
        id:
          type: string
          description: shrkbot's own id, returned for your reference. You never send it back to us.
          example: "tst_01ABCDEFGHIJKLMNOPQRSTUVWX"
        external_id:
          type: string
          example: "otsl-2026"
