paths:
  /tournaments/{external_id}:
    parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Create or update a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournament]
              properties:
                tournament:
                  $ref: "#/components/schemas/TournamentInput"
      responses:
        "200":
          description: Tournament updated
        "201":
          description: Tournament created
        "422":
          description: Validation failed
    delete:
      summary: Delete a tournament
      responses:
        "204":
          description: Tournament deleted, or no such tournament
components:
  schemas:
    TournamentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        parent_external_id:
          type: string
        status:
          type: string
