base_locale: en
locales: [en]

data:
  read:
    - config/locales/*.%{locale}.yml
  write:
    - ["activity_log.*", "config/locales/activity_log.%{locale}.yml"]
    - ["views.imprint.*", "config/locales/legal.%{locale}.yml"]
    - ["views.privacy_policy.*", "config/locales/legal.%{locale}.yml"]
    - ["views.terms_of_service.*", "config/locales/legal.%{locale}.yml"]
    - ["components.legal_page.*", "config/locales/legal.%{locale}.yml"]
    - ["operations.*", "config/locales/operations.%{locale}.yml"]
    - "config/locales/web.%{locale}.yml"

# Relative keys in the abstract show views (SubPluginShow, PluginConfigShow),
# in Components::TwilightStruggle::SettingCardBase and in
# Components::Feeds::Twitch::ModeField resolve at runtime
# against the SUBCLASS scope (e.g. logging/welcomes show),
# which the static file-path scoping above cannot see.
ignore_missing:
  - views.servers.moderation.sub_plugin_show.role_locked_reason
  - views.servers.moderation.sub_plugin_show.no_role_callout_lead
  - views.servers.moderation.sub_plugin_show.no_role_callout_body
  - views.servers.moderation.sub_plugin_show.no_role_callout_link
  - views.servers.moderation.sub_plugin_show.no_role_callout_suffix
  - views.servers.plugin_config_show.*
  - components.twilight_struggle.setting_card_base.label
  - components.twilight_struggle.setting_card_base.help
  - components.twilight_struggle.setting_card_base.inherits_from
  - components.twilight_struggle.setting_card_base.inherits_default
  - components.feeds.twitch.mode_field.label
  - components.feeds.twitch.mode_field.preview

# Every entry here is a key that IS used, by an indirection the static scanner
# cannot follow. Keep this list exact — a wildcard wide enough to cover a real
# dead key makes the whole report worthless. Six mechanisms, in order:
#
# 1. The abstract show views resolve `t(".key")` against the subclass scope, so
#    the scanner attributes the lookup to the base class instead.
# 2. A ternary inside the `t()` call.
# 3. Key strings held in a constant and looked up by symbol.
# 4. The key chosen by a ternary before the `t()` call.
# 5. ActiveModel error messages, looked up by `errors.add(:base, :symbol)`.
# 6. The key built from `Feeds.event_key(event_type)` inside the `t()` call.
ignore_unused:
  # 5. Feeds::Twitch::Settings
  - activerecord.errors.models.feeds/twitch/settings.attributes.categories.too_long
  # 6. Components::Feeds::VolumeLine
  - components.feeds.volume_line.counts.*
  # 1. Views::Servers::SubPluginShow subclasses (through Moderation::SubPluginShow)
  - views.servers.spam_protection.show.*
  - views.servers.image_scanning.show.*
  # 1. Components::Feeds::Twitch::ModeField subclasses
  - components.feeds.twitch.end_mode_field.*
  - components.feeds.twitch.switched_away_field.*
  # 1. Components::Feeds::TargetCard (caption key read only when the source has one)
  - components.feeds.target_card.steam.external_id
  # 1. Components::Feeds::EventTypeSetting (help key read only when it exists)
  - components.feeds.event_types.announcement_published.help
  - components.feeds.event_types.article_published.help
  - components.feeds.event_types.patch_notes_published.help
  # 1. Views::Servers::SubPluginShow subclasses
  - views.servers.steam.show.title
  - views.servers.steam.show.description
  - views.servers.twitch.show.title
  - views.servers.twitch.show.description
  # 1. Views::Servers::PluginConfigShow subclasses
  - views.servers.logging.show.*
  - views.servers.roles.show.*
  - views.servers.welcomes.show.*
  - views.servers.lfg.show.title
  - views.servers.lfg.show.description
  - views.servers.lfg.show.gate_message
  - views.servers.reminders.show.title
  - views.servers.reminders.show.description
  - views.servers.reminders.show.badge
  - views.servers.moderation.show.title
  - views.servers.moderation.show.description
  - views.servers.moderation.show.gate_message
  - views.servers.integrations.show.title
  - views.servers.integrations.show.description
  - views.servers.integrations.show.gate_message
  - views.servers.twilight_struggle.show.title
  - views.servers.twilight_struggle.show.description
  - views.servers.twilight_struggle.show.gate_message
  # 1. Components::TwilightStruggle::SettingCardBase subclasses
  - components.twilight_struggle.player_display_card.label
  - components.twilight_struggle.player_display_card.help
  - components.twilight_struggle.player_display_card.inherits_from
  - components.twilight_struggle.player_display_card.inherits_default
  - components.twilight_struggle.post_delay_card.label
  - components.twilight_struggle.post_delay_card.help
  - components.twilight_struggle.post_delay_card.inherits_from.one
  - components.twilight_struggle.post_delay_card.inherits_from.other
  - components.twilight_struggle.post_delay_card.inherits_default
  # 2. Admin::SettingsController#update
  - admin.settings.dms_enabled
  - admin.settings.dms_disabled
  # 3. AssignableRoleOptions::REASON_KEYS
  - assignable_roles.managed
  - assignable_roles.above_bot
  # 4. Servers::PluginsController#feedback
  - servers.plugin_enabled
  - servers.plugin_disabled

search:
  paths:
    - app/
  # Phlex views/components are Ruby classes, so a relative `t(".key")` is scoped
  # by the class name (Views::Servers::Index -> views.servers.index). Rooting at
  # `app` makes the file path resolve to the same scope; excluding the method
  # name stops i18n-tasks appending the enclosing method (Phlex scopes by class,
  # not method).
  relative_roots:
    - app
  relative_exclude_method_name_paths:
    - app
